<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중3이 양산고에 묻는다 | 양산고등학교 입학 Q&amp;A</title>
<meta name="description" content="양산고등학교 입학 안내 자료에서 궁금한 내용을 찾아보세요. 자료에 없는 내용은 055-384-9503으로 문의해 주세요.">
<meta property="og:title" content="중3이 양산고에 묻는다">
<meta property="og:description" content="일과, 교복, 기숙사 등 양산고 입학 궁금증을 자료에서 바로 찾아보세요.">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6}
header{background:#0f172a;color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.hin{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{background:#2563eb;font-size:11px;font-weight:800;padding:2px 8px;border-radius:4px;margin-right:8px}
.tel{color:#e2e8f0;background:#1e293b;border:1px solid #334155;padding:6px 12px;border-radius:8px;font-size:12px;text-decoration:none;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px}
section{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:#64748b;margin:0 0 12px}
form{display:flex;gap:8px}input{flex:1;min-width:0;padding:13px 14px;font-size:16px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc}input:focus{outline:2px solid #2563eb}
form button{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
.notice{font-size:12px;background:#eff6ff;color:#1e40af;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.lbl{font-size:12px;color:#64748b;margin:14px 0 4px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip,.cat{font-size:13px;padding:6px 12px;border:1px solid #e2e8f0;border-radius:999px;background:#f1f5f9;cursor:pointer;font-family:inherit}.chip:hover,.cat:hover{background:#eff6ff;color:#2563eb}.cat.on{background:#2563eb;color:#fff;border-color:#2563eb}
.btn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;text-decoration:none;display:inline-block}
details{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;background:#f8fafc;margin-top:8px}details[open]{background:#fff;border-color:#93c5fd}summary{font-weight:700;font-size:14px;cursor:pointer}
.body{font-size:13.5px;color:#334155;margin-top:8px;border-top:1px solid #f1f5f9;padding-top:8px}.body p{margin:6px 0}.body ul,.body ol{margin:6px 0;padding-left:20px}
.tw{overflow-x:auto;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}th{background:#f1f5f9}
.meta{font-size:11px;color:#94a3b8;margin-top:8px;border-top:1px solid #e2e8f0;padding-top:6px}.warn{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 10px;margin-top:6px}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px}.ct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:10px;font-weight:700;color:#2563eb;background:#dbeafe;padding:2px 6px;border-radius:4px}
.qline{margin:14px 0 0;font-size:14px}.hint{font-size:12px;color:#64748b}
.fallback{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:18px;text-align:center;margin-top:10px;font-size:13.5px}.fallback div{font-size:24px}
footer{background:#0f172a;color:#94a3b8;text-align:center;font-size:12px;padding:20px;margin-top:16px}footer b{color:#e2e8f0}
</style>
</head>
<body>
<header><div class="hin"><div><span class="badge">양산고</span><b style="font-size:15px">입학 Q&amp;A</b></div><a class="tel" href="tel:055-384-9503">☎ 055-384-9503</a></div></header>
<main>
<section>
<h1>중3이 양산고에 묻는다</h1>
<p class="sub">궁금한 내용을 입력하면 학교 안내 자료에서 찾아 그대로 보여드립니다.</p>
<div class="notice">학교 자료에 있는 내용만 보여드립니다. 이름·연락처 등 개인정보는 입력하지 마세요.</div>
<form id="form"><input id="q" type="search" maxlength="200" placeholder="예: 교복 어디서 사요? 기숙사 신청 언제?" autocomplete="off"><button type="submit">찾기</button></form>
<div class="lbl">자주 묻는 질문</div><div class="chips" id="chips"></div>
<div class="lbl">분야별로 보기</div><div class="chips" id="cats"></div>
<div id="result"></div>
</section>
</main>
<footer><b>양산고등학교</b><br>경남 양산시 호국학도병길 2 (북부동)<br>문의: 055-384-9503<br>일부 자료는 2026학년도 기준입니다. 최신 내용은 학교로 확인해 주세요.</footer>
<script>

const SCHOOL="양산고등학교", PHONE="055-384-9503", ADMISSION_YEAR=2027;
const CSV_URL="cards.csv";
const REQUIRED=["category","title","questions","content","source","year","featured"];
const MIN_SCORE=0.18, TOP_K=3;
const STOP=["있나요","있어요","인가요","입니까","어떻게","어떤","알려주세요","알려줘","나오나요","나와요","해요","하나요","되나요","무엇","뭐예요","있습니까","있는지","언제","어디","돼요","되요","가능해요","가능한가요","여도","해도"];
function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderMd(text){
  const out=[];let mode=null;
  const close=()=>{if(mode==="ul")out.push("</ul>");else if(mode==="ol")out.push("</ol>");else if(mode==="table")out.push("</tbody></table></div>");mode=null;};
  for(const raw of String(text).split(/\r?\n/)){
    const l=raw.trimEnd();
    if(!l.trim()){close();continue;}
    if(l.startsWith("|")){
      const cells=l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{3,}:?$/.test(c)))continue;
      if(mode!=="table"){close();out.push('<div class="tw"><table><thead><tr>'+cells.map(c=>`<th>${esc(c)}</th>`).join("")+"</tr></thead><tbody>");mode="table";}
      else out.push("<tr>"+cells.map(c=>`<td>${esc(c)}</td>`).join("")+"</tr>");
    }else if(/^[-*] /.test(l)){if(mode!=="ul"){close();out.push("<ul>");mode="ul";}out.push(`<li>${esc(l.slice(2))}</li>`);}
    else if(/^\d+\. /.test(l)){if(mode!=="ol"){close();out.push("<ol>");mode="ol";}out.push(`<li>${esc(l.replace(/^\d+\. /,""))}</li>`);}
    else{close();out.push(`<p>${esc(l)}</p>`);}
  }
  close();return out.join("");
}
function norm(t){let s=String(t).toLowerCase();for(const w of STOP)s=s.split(w).join(" ");s=s.replace(/[^0-9a-z가-힣]/g," ");return s.replace(/\s+/g,"");}
function grams(s){const m=new Map();for(const n of [2,3])for(let i=0;i+n<=s.length;i++){const g=s.substr(i,n);m.set(g,(m.get(g)||0)+1);}return m;}
function buildIndex(cards){
  const docs=cards.map(c=>{const t=(c.title+" ").repeat(2)+(c.questions.join(" ")+" ").repeat(3)+c.content;return grams(norm(t));});
  const df=new Map();docs.forEach(d=>d.forEach((_,g)=>df.set(g,(df.get(g)||0)+1)));
  const N=docs.length, idf=new Map();df.forEach((v,g)=>idf.set(g,Math.log((1+N)/(1+v))+1));
  const vec=m=>{const v=new Map();let sq=0;m.forEach((tf,g)=>{if(!idf.has(g))return;const w=(1+Math.log(tf))*idf.get(g);v.set(g,w);sq+=w*w;});const n=Math.sqrt(sq)||1;v.forEach((w,g)=>v.set(g,w/n));return v;};
  return {vecs:docs.map(vec),vec,qn:cards.map(c=>c.questions.map(norm).filter(Boolean))};
}
function search(idx,query){
  const q=norm(query);if(!q)return [];
  const qv=idx.vec(grams(q));
  const sc=idx.vecs.map((dv,i)=>{let s=0;qv.forEach((w,g)=>{const d=dv.get(g);if(d)s+=w*d;});
    if(idx.qn[i].some(x=>q.includes(x)||x.includes(q)))s+=0.3;return [i,s];});
  return sc.filter(x=>x[1]>=MIN_SCORE).sort((a,b)=>b[1]-a[1]).slice(0,TOP_K).map(x=>x[0]);
}


const $=id=>document.getElementById(id);
let CARDS=[],idx=null,feat=[],cats=[],curCat="";
function warnHtml(year){const m=String(year).match(/\d{4}/);return (m&&parseInt(m[0])<ADMISSION_YEAR)?`<div class="warn">⚠️ ${m[0]}학년도 기준 자료입니다. 최신 내용은 ${SCHOOL}(${PHONE})로 확인해 주세요.</div>`:"";}
function metaHtml(c){return `<div class="meta">출처: ${esc(c.source)}${c.year?` (${esc(c.year)})`:""}</div>`+warnHtml(c.year);}
function cardHtml(c){return `<article class="card"><div class="ct"><span class="tag">${esc(c.category)}</span><strong>${esc(c.title)}</strong></div><div class="body">${c.html}</div>${metaHtml(c)}</article>`;}
function fallbackHtml(){return `<div class="fallback"><div>☎️</div><p>죄송합니다. 제공된 학교 자료에서 해당 내용을 찾을 수 없습니다.<br>해당 내용은 <b>${SCHOOL}(${PHONE})</b>로 문의해 주세요.</p><a class="btn" href="tel:${PHONE}">☎ ${PHONE} 전화 문의</a></div>`;}
function markCat(mode){for(const x of $("cats").children)x.classList.toggle("on",(mode==="cat"&&x.dataset.c===curCat)||(mode==="all"&&x.dataset.c==="ALL"));}
function ask(q){
  const out=$("result");q=q.trim();
  if(!q){if(out.dataset.mode==="search"){out.innerHTML="";out.dataset.mode="";}return;}
  curCat="";out.dataset.mode="search";markCat("");
  const hits=search(idx,q);
  let h=`<p class="qline"><b>질문:</b> <span id="qtext"></span></p>`;
  h+=hits.length?hits.map(i=>cardHtml(CARDS[i])).join("")+`<p class="hint">찾은 내용이 질문과 다르면 ${SCHOOL}(${PHONE})로 문의해 주세요.</p>`:fallbackHtml();
  out.innerHTML=h;$("qtext").textContent=q;
}
function showCat(c){
  curCat=c;$("q").value="";$("result").dataset.mode=c?"cat":"all";markCat(c?"cat":"all");
  const list=CARDS.filter(x=>!c||x.category===c);
  $("result").innerHTML=`<p class="qline"><b>${c?esc(c):"전체"}</b> 자료 ${list.length}건</p>`+list.map(x=>`<details><summary>${esc(x.title)}</summary><div class="body">${x.html}</div>${metaHtml(x)}</details>`).join("");
}
function showError(msg){$("result").innerHTML=`<div class="fallback"><div>⚠️</div><p>${esc(msg)}<br>잠시 후 다시 시도하거나 <b>${SCHOOL}(${PHONE})</b>로 문의해 주세요.</p><a class="btn" href="tel:${PHONE}">☎ ${PHONE} 전화 문의</a></div>`;}
async function init(){
  $("form").addEventListener("submit",e=>{e.preventDefault();if(idx)ask($("q").value);});
  $("q").addEventListener("input",()=>{if(idx)ask($("q").value);});
  try{
    const res=await fetch(CSV_URL,{cache:"no-cache"});
    if(!res.ok)throw new Error("cards.csv를 불러오지 못했습니다.");
    const rows=parseCSV(await res.text());
    const head=rows[0].map(h=>h.trim());
    const miss=REQUIRED.filter(h=>!head.includes(h));
    if(miss.length)throw new Error("cards.csv에 필요한 열이 없습니다: "+miss.join(", "));
    CARDS=rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||"").trim());
      o.questions=o.questions.split("|").map(x=>x.trim()).filter(Boolean);o.html=renderMd(o.content);
      o.featured=/^(y|yes|1|true|o)$/i.test(o.featured);return o;}).filter(c=>c.title&&c.content);
    if(!CARDS.length)throw new Error("등록된 자료가 없습니다.");
  }catch(e){showError(e.message||"자료를 불러오지 못했습니다.");return;}
  idx=buildIndex(CARDS);feat=CARDS.filter(c=>c.featured);cats=[...new Set(CARDS.map(c=>c.category))];
  $("chips").innerHTML=feat.map(c=>`<button type="button" class="chip" data-q="${esc(c.questions[0]||c.title)}">${esc(c.questions[0]||c.title)}</button>`).join("");
  $("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){$("q").value=b.dataset.q;ask(b.dataset.q);}};
  $("cats").innerHTML=`<button type="button" class="cat" data-c="ALL">전체</button>`+cats.map(c=>`<button type="button" class="cat" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("cats").onclick=e=>{const b=e.target.closest(".cat");if(b)showCat(b.dataset.c==="ALL"?"":b.dataset.c);};
  const p=new URLSearchParams(location.search);
  if(p.get("q")){$("q").value=p.get("q").slice(0,200);ask($("q").value);}
  else if(p.get("c")){showCat(p.get("c"));}
}
init();

</script>
</body>
</html>
