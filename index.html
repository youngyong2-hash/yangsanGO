const SCHOOL="양산고등학교", PHONE="055-384-9503", ADMISSION_YEAR=2027;
const VIDEO_ID="";            // 유튜브 영상 ID (예: dQw4w9WgXcQ). 비워 두면 '준비 중' 표시
const BROCHURE_PAGES=[];      // 예: ["brochure/01.png","brochure/02.png"]
const BROCHURE_PDF="";        // 예: "brochure/brochure.pdf"
const MIN_SCORE=0.18, TOP_K=3;
const STOP=["있나요","있어요","인가요","입니까","어떻게","어떤","알려주세요","알려줘","나오나요","나와요","해요","하나요","되나요","무엇","뭐예요","있습니까","있는지","언제","어디","돼요","되요","가능해요","가능한가요","여도","해도"];
function norm(t){let s=String(t).toLowerCase();for(const w of STOP)s=s.split(w).join(" ");s=s.replace(/[^0-9a-z가-힣]/g," ");return s.replace(/\s+/g,"");}
function grams(s){const m=new Map();for(const n of [2,3])for(let i=0;i+n<=s.length;i++){const g=s.substr(i,n);m.set(g,(m.get(g)||0)+1);}return m;}
function buildIndex(cards){
  const docs=cards.map(c=>{const t=(c.title+" ").repeat(2)+(c.questions.join(" ")+" ").repeat(3)+c.text;return grams(norm(t));});
  const df=new Map();docs.forEach(d=>d.forEach((_,g)=>df.set(g,(df.get(g)||0)+1)));
  const N=docs.length, idf=new Map();df.forEach((v,g)=>idf.set(g,Math.log((1+N)/(1+v))+1));
  const vec=m=>{const v=new Map();let sq=0;m.forEach((tf,g)=>{if(!idf.has(g))return;const w=(1+Math.log(tf))*idf.get(g);v.set(g,w);sq+=w*w;});const n=Math.sqrt(sq)||1;v.forEach((w,g)=>v.set(g,w/n));return v;};
  return {vecs:docs.map(vec),vec,cards,qn:cards.map(c=>c.questions.map(norm).filter(Boolean))};
}
function search(idx,query){
  const q=norm(query);if(!q)return [];
  const qv=idx.vec(grams(q));
  const sc=idx.vecs.map((dv,i)=>{let s=0;qv.forEach((w,g)=>{const d=dv.get(g);if(d)s+=w*d;});
    if(idx.qn[i].some(x=>q.includes(x)||x.includes(q)))s+=0.3;return [i,s];});
  return sc.filter(x=>x[1]>=MIN_SCORE).sort((a,b)=>b[1]-a[1]).slice(0,TOP_K).map(x=>x[0]);
}
if(typeof module!=="undefined"){module.exports={norm,buildIndex,search};}


const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function metaHtml(c){
  let h=`<div class="meta">출처: ${esc(c.source)} (${esc(c.year)})</div>`;
  const m=String(c.year).match(/\d{4}/);
  if(m&&parseInt(m[0])<ADMISSION_YEAR)h+=`<div class="warn">⚠️ ${m[0]}학년도 기준 자료입니다. 최신 내용은 ${SCHOOL}(${PHONE})로 확인해 주세요.</div>`;
  return h;
}
function cardHtml(c){return `<article class="card"><div class="ct"><span class="tag">${esc(c.category)}</span><strong>${esc(c.title)}</strong></div><div class="body">${c.html}</div>${metaHtml(c)}</article>`;}
function renderVideo(){
  $("video").innerHTML=VIDEO_ID?`<div class="vwrap"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(VIDEO_ID)}" title="${SCHOOL} 홍보영상" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:`<p class="empty">홍보영상을 준비 중입니다.</p>`;
}
let bp=0;
function renderBrochure(){
  const box=$("brochure");
  if(!BROCHURE_PAGES.length){box.innerHTML=`<p class="empty">브로셔를 준비 중입니다.</p>`;return;}
  box.innerHTML=`<div class="bnav"><button id="bprev">◀ 이전</button><span id="bcount"></span><button id="bnext">다음 ▶</button></div><img id="bimg" alt="브로셔" style="width:100%;border-radius:10px">`+(BROCHURE_PDF?`<p><a class="btn" href="${esc(BROCHURE_PDF)}" target="_blank" rel="noopener">브로셔 PDF 보기</a></p>`:"");
  const show=()=>{$("bimg").src=BROCHURE_PAGES[bp];$("bcount").textContent=`${bp+1} / ${BROCHURE_PAGES.length}`;$("bprev").disabled=bp===0;$("bnext").disabled=bp>=BROCHURE_PAGES.length-1;};
  $("bprev").onclick=()=>{bp--;show();};$("bnext").onclick=()=>{bp++;show();};show();
}
const feat=CARDS.filter(c=>c.featured);
function renderFaq(){
  $("faq").innerHTML=feat.map(c=>`<details><summary>Q. ${esc(c.questions[0])}</summary><div class="body">${c.html}</div>${metaHtml(c)}</details>`).join("");
}
const idx=buildIndex(CARDS);
function ask(q){
  const out=$("result");q=q.trim();
  if(!q){out.innerHTML="";return;}
  const hits=search(idx,q);
  let h=`<p class="qline"><b>질문:</b> <span id="qtext"></span></p>`;
  if(!hits.length){h+=`<div class="fallback"><div>📋</div><p>죄송합니다. 제공된 학교 자료에서 해당 내용을 찾을 수 없습니다.<br>해당 내용은 <b>${SCHOOL}(${PHONE})</b>로 문의해 주세요.</p><a class="btn" href="tel:${PHONE}">📞 ${PHONE} 전화 문의</a></div>`;}
  else{h+=hits.map(i=>cardHtml(CARDS[i])).join("")+`<p class="hint">찾은 내용이 질문과 다르면 ${SCHOOL}(${PHONE})로 문의해 주세요.</p>`;}
  out.innerHTML=h;$("qtext").textContent=q;
}
function renderChips(){
  $("chips").innerHTML=feat.map(c=>`<button type="button" class="chip" data-q="${esc(c.questions[0])}">${esc(c.questions[0])}</button>`).join("");
  $("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){$("q").value=b.dataset.q;ask(b.dataset.q);}};
}
$("form").addEventListener("submit",e=>{e.preventDefault();ask($("q").value);});
renderVideo();renderBrochure();renderFaq();renderChips();

</script>
