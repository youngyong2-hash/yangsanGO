<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061232">
<title>양산고등학교 입학 Q&amp;A</title>
<meta name="description" content="양산고등학교 입학 안내 자료에서 궁금한 내용을 키워드로 찾아보세요. 자료에 없는 내용은 055-384-9503으로 문의해 주세요.">
<meta property="og:title" content="양산고등학교 입학 Q&amp;A">
<meta property="og:description" content="내신, 기숙사, 교복 등 양산고 입학 궁금증을 키워드로 바로 찾아보세요.">
<meta property="og:type" content="website">
<link rel="icon" href="emblem.png">
<style>
:root{--navy:#061232;--navy2:#0f2a66;--navy3:#1b3d8f;--soft:#e6ecf9;--line:#c3cfea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#0a1b45;color:#17213f;line-height:1.65;font-size:15px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #1b2f66}
header h2{margin:0;padding:13px 12px;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px}
.hero{display:flex;gap:14px;align-items:center;padding:6px 4px 16px;color:#fff}
.hero img{width:60px;height:60px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;flex:none}
.hero h1{font-size:23px;margin:0 0 4px;line-height:1.3;letter-spacing:-.3px}
.hero p{margin:0;font-size:14px;color:#cdd8f3}
section{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:15px 16px;font-size:17px;border:2px solid var(--line);border-radius:14px;background:#f6f8fd;color:#17213f}
input:focus{outline:none;border-color:var(--navy3);background:#fff}
form button{background:var(--navy2);color:#fff;border:0;border-radius:14px;padding:0 22px;font-weight:800;font-size:16px;cursor:pointer}
form button:hover{background:var(--navy3)}
.notice{font-size:12.5px;background:var(--soft);color:var(--navy2);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.lbl{font-size:14px;color:var(--navy2);margin:18px 0 8px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#f3f6fc;color:var(--navy2);cursor:pointer;font-family:inherit;font-weight:600}
.chip:hover,.chip:active{background:var(--soft);border-color:var(--navy3)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 6px;min-height:78px;border:1px solid var(--line);border-radius:16px;background:#f3f6fc;color:var(--navy2);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:center;word-break:keep-all}
.cat .ci{font-size:24px;line-height:1}
.cat:hover,.cat:active{background:var(--soft);border-color:var(--navy3)}
.cat.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.btn{background:var(--navy2);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:800;text-decoration:none;display:inline-block}
details{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#f6f8fd;margin-top:9px}
details[open]{background:#fff;border-color:var(--navy3)}
summary{font-weight:800;font-size:15px;cursor:pointer;color:var(--navy2)}
.body{font-size:14px;color:#26314f;margin-top:8px;border-top:1px solid #e3e9f6;padding-top:8px}
.body p{margin:6px 0}.body ul,.body ol{margin:6px 0;padding-left:20px}.body li{margin:3px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:var(--soft);color:var(--navy2)}
.meta{font-size:11.5px;color:#6b7aa0;margin-top:8px;border-top:1px solid #e3e9f6;padding-top:6px}
.warn{font-size:12.5px;color:#8a4b00;background:#fff7e0;border:1px solid #f1d58a;border-radius:10px;padding:7px 10px;margin-top:6px}
.card{background:#f6f8fd;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}
.ct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ct strong{color:var(--navy2);font-size:15.5px}
.tag{font-size:11px;font-weight:800;color:#fff;background:var(--navy3);padding:2px 8px;border-radius:6px}
.qline{margin:18px 0 0;font-size:15px}
.hint{font-size:12.5px;color:#51608a}
.fallback{background:#fff7e0;border:1px solid #f1d58a;border-radius:16px;padding:20px;text-align:center;margin-top:10px;font-size:14px}
.fallback div{font-size:28px}
footer{background:var(--navy);color:#aebbe0;text-align:center;font-size:12.5px;padding:24px 16px;margin-top:20px;line-height:1.8}
footer b{color:#fff;font-size:14px}
@media(max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:20px}header h2{font-size:16px}}
</style>
</head>
<body>
<header><h2>양산고등학교 입학 Q&amp;A</h2></header>
<main>
<div class="hero"><img src="emblem.png" alt="양산고등학교 교표" onerror="this.style.display='none'"><div><h1>중3이 양산고에 묻는다</h1><p>궁금한 내용을 키워드 위주로 검색해보세요.(예: 내신, 기숙사, 교복 등)</p></div></div>
<section>
<form id="form"><input id="q" type="search" maxlength="200" placeholder="키워드를 입력하세요 (예: 기숙사)" autocomplete="off"><button type="submit">검색</button></form>
<div class="notice" style="margin:10px 0 0">학교의 공식 자료만 안내드려요. 이름·연락처 같은 개인정보는 입력하지 마세요.</div>
<div class="lbl">🔥 많이 찾는 질문</div><div class="chips" id="chips"></div>
<div class="lbl">📂 분야별로 보기</div><div class="tiles" id="cats"></div>
<div id="result"></div>
</section>
</main>
<footer><b>양산고등학교 교무기획부</b><br>경남 양산시 호국학도병길 2 (북부동)<br>문의: 055-384-9503<br></footer>
<script>

const SCHOOL="양산고등학교", PHONE="055-384-9503", ADMISSION_YEAR=2027;
const CSV_URL="cards.csv";
const REQUIRED=["category","title","questions","content","source","year","featured"];
const ICONS={"일과시간":"⏰","교육과정":"📚","학교생활":"🏫","교복·체육복":"👔","기숙사":"🏢","학교현황":"📊","도서관":"📖","학부모회":"🤝","학생회":"🎤","동아리":"🎸","교기":"🥋","시설":"⚽","전형일정":"📅","입학":"📅"};
const MIN_SCORE=0.18, TOP_K=3;
const STOP=["있나요","있어요","인가요","입니까","어떻게","어떤","알려주세요","알려줘","나오나요","나와요","해요","하나요","되나요","무엇","뭐예요","있습니까","있는지","언제","어디","돼요","되요","가능해요","가능한가요","여도","해도"];
function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderMd(text){
  const out=[];let mode=null;
  const close=()=>{if(mode==="ul")out.push("</ul>");else if(mode==="ol")out.push("</ol>");else if(mode==="table")out.push("</tbody></table></div>");mode=null;};
  for(const raw of String(text).split(/\r?\n/)){
    const l=raw.trimEnd();
    if(!l.trim()){close();continue;}
    if(l.startsWith("|")){
      const cells=l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{3,}:?$/.test(c)))continue;
      if(mode!=="table"){close();out.push('<div class="tw"><table><thead><tr>'+cells.map(c=>`<th>${esc(c)}</th>`).join("")+"</tr></thead><tbody>");mode="table";}
      else out.push("<tr>"+cells.map(c=>`<td>${esc(c)}</td>`).join("")+"</tr>");
    }else if(/^[-*] /.test(l)){if(mode!=="ul"){close();out.push("<ul>");mode="ul";}out.push(`<li>${esc(l.slice(2))}</li>`);}
    else if(/^\d+\. /.test(l)){if(mode!=="ol"){close();out.push("<ol>");mode="ol";}out.push(`<li>${esc(l.replace(/^\d+\. /,""))}</li>`);}
    else{close();out.push(`<p>${esc(l)}</p>`);}
  }
  close();return out.join("");
}
function norm(t){let s=String(t).toLowerCase();for(const w of STOP)s=s.split(w).join(" ");s=s.replace(/[^0-9a-z가-힣]/g," ");return s.replace(/\s+/g,"");}
function grams(s){const m=new Map();for(const n of [2,3])for(let i=0;i+n<=s.length;i++){const g=s.substr(i,n);m.set(g,(m.get(g)||0)+1);}return m;}
function buildIndex(cards){
  const docs=cards.map(c=>{const t=(c.title+" ").repeat(2)+(c.questions.join(" ")+" ").repeat(3)+c.content;return grams(norm(t));});
  const df=new Map();docs.forEach(d=>d.forEach((_,g)=>df.set(g,(df.get(g)||0)+1)));
  const N=docs.length, idf=new Map();df.forEach((v,g)=>idf.set(g,Math.log((1+N)/(1+v))+1));
  const vec=m=>{const v=new Map();let sq=0;m.forEach((tf,g)=>{if(!idf.has(g))return;const w=(1+Math.log(tf))*idf.get(g);v.set(g,w);sq+=w*w;});const n=Math.sqrt(sq)||1;v.forEach((w,g)=>v.set(g,w/n));return v;};
  return {vecs:docs.map(vec),vec,qn:cards.map(c=>c.questions.map(norm).filter(Boolean))};
}
function search(idx,query){
  const q=norm(query);if(!q)return [];
  const qv=idx.vec(grams(q));
  const sc=idx.vecs.map((dv,i)=>{let s=0;qv.forEach((w,g)=>{const d=dv.get(g);if(d)s+=w*d;});
    if(idx.qn[i].some(x=>q.includes(x)||x.includes(q)))s+=0.3;return [i,s];});
  return sc.filter(x=>x[1]>=MIN_SCORE).sort((a,b)=>b[1]-a[1]).slice(0,TOP_K).map(x=>x[0]);
}


const $=id=>document.getElementById(id);
let CARDS=[],idx=null,feat=[],cats=[],curCat="";
function warnHtml(year){const m=String(year).match(/\d{4}/);return (m&&parseInt(m[0])<ADMISSION_YEAR)?`<div class="warn">⚠️ ${m[0]}학년도 기준 자료입니다. 최신 내용은 ${SCHOOL}(${PHONE})로 확인해 주세요.</div>`:"";}
function metaHtml(c){return `<div class="meta">출처: ${esc(c.source)}${c.year?` (${esc(c.year)})`:""}</div>`+warnHtml(c.year);}
function cardHtml(c){return `<article class="card"><div class="ct"><span class="tag">${esc(c.category)}</span><strong>${esc(c.title)}</strong></div><div class="body">${c.html}</div>${metaHtml(c)}</article>`;}
function fallbackHtml(){return `<div class="fallback"><div>☎️</div><p>죄송합니다. 제공된 학교 자료에서 해당 내용을 찾을 수 없습니다.<br>해당 내용은 <b>${SCHOOL}(${PHONE})</b>로 문의해 주세요.</p><a class="btn" href="tel:${PHONE}">☎ ${PHONE} 전화 문의</a></div>`;}
function markCat(mode){for(const x of $("cats").children)x.classList.toggle("on",(mode==="cat"&&x.dataset.c===curCat)||(mode==="all"&&x.dataset.c==="ALL"));}
function ask(q){
  const out=$("result");q=q.trim();
  if(!q){if(out.dataset.mode==="search"){out.innerHTML="";out.dataset.mode="";}return;}
  curCat="";out.dataset.mode="search";markCat("");
  const hits=search(idx,q);
  let h=`<p class="qline">🔎 <b id="qtext"></b> 검색 결과</p>`;
  h+=hits.length?hits.map(i=>cardHtml(CARDS[i])).join("")+`<p class="hint">찾은 내용이 원하는 답이 아니면 ${SCHOOL}(${PHONE})로 문의해 주세요.</p>`:fallbackHtml();
  out.innerHTML=h;$("qtext").textContent=q;
}
function showCat(c){
  curCat=c;$("q").value="";$("result").dataset.mode=c?"cat":"all";markCat(c?"cat":"all");
  const list=CARDS.filter(x=>!c||x.category===c);
  $("result").innerHTML=`<p class="qline"><b>${c?esc(c):"전체"}</b> 자료 ${list.length}건</p>`+list.map(x=>`<details><summary>${esc(x.title)}</summary><div class="body">${x.html}</div>${metaHtml(x)}</details>`).join("");
}
function showError(msg){$("result").innerHTML=`<div class="fallback"><div>⚠️</div><p>${esc(msg)}<br>잠시 후 다시 시도하거나 <b>${SCHOOL}(${PHONE})</b>로 문의해 주세요.</p><a class="btn" href="tel:${PHONE}">☎ ${PHONE} 전화 문의</a></div>`;}
async function init(){
  $("form").addEventListener("submit",e=>{e.preventDefault();if(idx)ask($("q").value);});
  $("q").addEventListener("input",()=>{if(idx)ask($("q").value);});
  try{
    const res=await fetch(CSV_URL,{cache:"no-cache"});
    if(!res.ok)throw new Error("cards.csv를 불러오지 못했습니다.");
    const rows=parseCSV(await res.text());
    const head=rows[0].map(h=>h.trim());
    const miss=REQUIRED.filter(h=>!head.includes(h));
    if(miss.length)throw new Error("cards.csv에 필요한 열이 없습니다: "+miss.join(", "));
    CARDS=rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||"").trim());
      o.questions=o.questions.split("|").map(x=>x.trim()).filter(Boolean);o.html=renderMd(o.content);
      o.featured=/^(y|yes|1|true|o)$/i.test(o.featured);return o;}).filter(c=>c.title&&c.content);
    if(!CARDS.length)throw new Error("등록된 자료가 없습니다.");
  }catch(e){showError(e.message||"자료를 불러오지 못했습니다.");return;}
  idx=buildIndex(CARDS);feat=CARDS.filter(c=>c.featured);cats=[...new Set(CARDS.map(c=>c.category))];
  $("chips").innerHTML=feat.map(c=>`<button type="button" class="chip" data-q="${esc(c.questions[0]||c.title)}">${esc(c.questions[0]||c.title)}</button>`).join("");
  $("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){$("q").value=b.dataset.q;ask(b.dataset.q);}};
  $("cats").innerHTML=`<button type="button" class="cat" data-c="ALL"><span class="ci">📋</span><span>전체</span></button>`+cats.map(c=>`<button type="button" class="cat" data-c="${esc(c)}"><span class="ci">${ICONS[c]||"📌"}</span><span>${esc(c)}</span></button>`).join("");
  $("cats").onclick=e=>{const b=e.target.closest(".cat");if(b)showCat(b.dataset.c==="ALL"?"":b.dataset.c);};
  const p=new URLSearchParams(location.search);
  if(p.get("q")){$("q").value=p.get("q").slice(0,200);ask($("q").value);}
  else if(p.get("c")){showCat(p.get("c"));}
}
init();

</script>
</body>
</html>
